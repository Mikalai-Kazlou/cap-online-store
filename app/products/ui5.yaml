specVersion: "2.5"
metadata:
  name: ns.products
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateVersionInfo
      configuration:
        archiveName: products
        relativePaths: true
        additionalFiles:
          - xs-app.json
